[package]
name = "zcloud-fileflow"
version = "0.1.0"
description = "Private, offline-first file tools for Windows"
authors = ["Zcloud Digitech"]
edition = "2021"

[lib]
name = "zcloud_fileflow_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
fileflow_engine = { path = "../crates/image_engine" }
serde = { version = "1.0", features = ["derive"] }
